name: Phare Health
description: >-
  Phare Health builds AI tools for healthcare revenue cycle management (RCM),
  focused on medical coding and clinical documentation improvement (CDI). Its
  platform analyzes complete electronic health records to generate accurate,
  compliant medical codes and to catch coding errors before bills are
  submitted. Products include Phare Audit (a pre-bill safety net that screens
  encounters for errors), Phare Autonomous (automated coding of simpler cases
  with explainability), and Phare Analytics (coding workflow and financial
  monitoring). The UK-founded, General Catalyst-backed company has been
  acquired by R1 and integrated into its R37 lab division. Phare Health
  operates as a closed B2B product and publishes no public developer API,
  documentation, SDK, or status page at this time.
